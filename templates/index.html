<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video AI Webapp</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 650px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-group { margin-bottom: 25px; }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #444;
            font-size: 15px;
        }
        input[type="number"], select {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Kantumruy Pro', sans-serif;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .file-input-btn {
            display: block;
            padding: 20px;
            background: #f0f2f5;
            border: 2px dashed #ccc;
            border-radius: 10px;
            text-align: center;
            color: #666;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .file-input-btn:hover {
            border-color: #667eea;
            background: #eef1ff;
        }
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 700;
            font-family: 'Kantumruy Pro', sans-serif;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .note { font-size: 13px; color: #888; margin-top: 8px; }
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Video AI Webapp</h1>
        <form id="uploadForm" action="/process" method="POST" enctype="multipart/form-data">

            <!-- 1. Upload វីដេអូ -->
            <div class="form-group">
                <label>1. ជ្រើសរើសវីដេអូ (Upload Video)</label>
                <div class="file-input-wrapper">
                    <input type="file" name="video" id="videoFile" accept="video/*" required>
                    <label for="videoFile" class="file-input-btn" id="fileLabel">📁 ចុចទីនេះដើម្បីជ្រើសរើសវីដេអូ</label>
                </div>
            </div>

            <!-- 2. កាត់វីដេអូស្វ័យប្រវត្តិ -->
            <div class="form-group">
                <label>2. កាត់វីដេអូស្វ័យប្រវត្តិ (Auto Split)</label>
                <input type="number" name="minutes_per_part" min="1" step="1" placeholder="បំពេញចំនួននាទី (ទុកទទេ = មិនកាត់)">
                <p class="note">* បើទុកទទេ វីដេអូនឹងចេញពេញលេញធម្មតា។ បើបំពេញ ឧ. 10 នាទី វីដេអូ 60 នាទី នឹងកាត់ជា 6 ផ្នែក។</p>
            </div>

            <!-- 3. ជ្រើសរើសភាសាបកប្រែ -->
            <div class="form-group">
                <label>3. ជ្រើសរើសភាសាបកប្រែ (Target Language)</label>
                <select name="target_language">
                    <option value="km">ខ្មែរ (Khmer)</option>
                    <option value="en">អង់គ្លេស (English)</option>
                    <option value="th">ថៃ (Thai)</option>
                    <option value="vi">វៀតណាម (Vietnamese)</option>
                    <option value="zh">ចិន (Chinese)</option>
                </select>
            </div>

            <!-- 4. ជ្រើសរើសសំឡេង AI -->
            <div class="form-group">
                <label>4. ជ្រើសរើសសំឡេង AI (Voice)</label>
                <select name="voice_gender">
                    <option value="female">សំឡេងស្រី (Female)</option>
                    <option value="male">សំឡេងប្រុស (Male)</option>
                    <option value="both">ស្រី+ប្រុស តាមតួអង្គ (Both)</option>
                </select>
            </div>

            <button type="submit" id="submitBtn">🚀 ចាប់ផ្តើមដំណើរការ (Process Video)</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>⏳ កំពុងដំណើរការ សូមរង់ចាំបន្តិច...</p>
        </div>
    </div>

    <script>
        document.getElementById('videoFile').onchange = function(e) {
            const fileName = e.target.files[0] ? e.target.files[0].name : '📁 ចុចទីនេះដើម្បីជ្រើសរើសវីដេអូ';
            document.getElementById('fileLabel').textContent = '📁 ' + fileName;
        };

        document.getElementById('uploadForm').onsubmit = function(e) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('submitBtn').disabled = true;
        };
    </script>
</body>
</html>
